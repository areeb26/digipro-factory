{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="text-center py-5">
            <div class="mb-4">
                {% if error_code == 404 %}
                <i class="bi bi-question-circle text-primary" style="font-size: 6rem;"></i>
                {% elif error_code == 500 %}
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 6rem;"></i>
                {% else %}
                <i class="bi bi-x-circle text-warning" style="font-size: 6rem;"></i>
                {% endif %}
            </div>

            <h1 class="display-4 fw-bold mb-3">Error {{ error_code }}</h1>
            <p class="lead text-muted mb-4">{{ error_message }}</p>

            <div class="d-flex gap-2 justify-content-center">
                <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                    <i class="bi bi-house"></i> Go to Dashboard
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary btn-lg">
                    <i class="bi bi-arrow-left"></i> Go Back
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
